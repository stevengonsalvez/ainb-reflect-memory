name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger kept for re-running the heavy jobs on demand. golden-diff
  # runs on every PR as the compat gate (see the job comment).
  workflow_dispatch:

# Cancel in-progress runs on the same ref so a series of pushes doesn't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint + type-check + unit and Postgres integration tests on the SLIM
  # ([dev,postgres]) install.
  #
  # We deliberately do NOT install the [graph] extra here: it pulls
  # sentence-transformers -> torch and nano-graphrag's import-time chain.
  # graph_engine.py lazy-imports that stack inside _get_graph_engine(), and the
  # unit tests under tests/ stub networkx / inject a fake sentence_transformers
  # (or pytest.importorskip), so the base suite is green without it. The
  # nano-graphrag adapter tests (tests/postgres/nanographrag) importorskip
  # nano_graphrag here and run for real in golden-diff. The heavy GraphRAG +
  # LOCOMO suites under tests/eval/ need [graph] + model downloads + an API
  # key and are excluded here.
  # ---------------------------------------------------------------------------
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    # A real Postgres with pgvector so the integration tier (tests/postgres)
    # runs instead of skipping. The migrations need the vector extension,
    # hence the pgvector image rather than postgres:17. localhost is what the
    # disposable-DSN guard in tests/_support/pg.py accepts.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: reflect
          POSTGRES_PASSWORD: reflect_test
          POSTGRES_DB: reflect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflect -d reflect_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://reflect:reflect_test@localhost:5432/reflect_test
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - name: install package (dev extra only — NOT graph) into a uv venv
        # uv venv creates .venv and downloads the matrix interpreter if needed;
        # uv pip install targets that venv; uv run executes inside it. We do NOT
        # use `uv pip install --system`: the runner's interpreter is externally
        # managed (PEP 668), so --system aborts with exit 2.
        # [dev] gives ruff/mypy/pytest/respx/jsonschema. [graph] is intentionally
        # omitted (see job comment): the graph stack lazy-imports, so the slim
        # suite is green without it.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev,postgres]'

      - name: ruff check
        # NON-BLOCKING for now: the freshly-extracted engine carries a backlog
        # of style violations (f-strings w/o placeholders, semicolon-joined
        # statements in tests/eval/locomo plot scripts, a few unused imports).
        # Ruff still RUNS on every PR via --output-format=github so the
        # annotations show inline; flip continue-on-error off once the backlog
        # is cleared (`ruff check --fix src/reflect_kb tests`).
        continue-on-error: true
        run: uv run ruff check --output-format=github src/reflect_kb tests

      - name: mypy (src/reflect_kb)
        # NON-BLOCKING: src/reflect_kb is not fully typed yet, and the slim
        # install is missing stubs for the optional graph stack
        # (sentence_transformers / numpy / nano_graphrag) plus PyYAML
        # (types-PyYAML). Those import-not-found / import-untyped errors are
        # expected on the slim build. Runs for signal; does not gate the build.
        continue-on-error: true
        run: uv run mypy src/reflect_kb

      - name: pytest (fast unit tests; excludes tests/eval and tests/compat)
        # THE gate for unit + Postgres integration tests. tests/eval needs the
        # [graph] extra, model downloads, and (LOCOMO) an Anthropic API key;
        # tests/compat needs the [graph] extra too and runs once, in the
        # golden-diff job, rather than three times across this matrix.
        run: uv run pytest -q tests --ignore=tests/eval --ignore=tests/compat

  # ---------------------------------------------------------------------------
  # Playwright e2e for the `reflect serve` memory browser. The suite launches
  # `reflect serve` against a FRESH copy of tests/e2e/fixture-kb (never the real
  # ~/.learnings) and drives all six curation/browse flows plus weightage
  # displays. serve.py uses only base deps (stdlib http + pyyaml), so the slim
  # install is enough — no [graph] extra needed. Screenshots + results.json are
  # uploaded as artifacts on every run.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - name: install package into a uv venv (slim — serve needs only base deps)
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install e2e deps
        working-directory: tests/e2e
        run: npm install

      - name: install playwright chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: run e2e suite (starts reflect serve against fixture copy)
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: upload screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/test-results/screenshots/
            tests/e2e/test-results/results.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Lightweight manifest validation. The Claude Code plugin ships its manifest
  # at BOTH plugin/.claude-plugin/plugin.json (the canonical Claude Code
  # location) and plugin/plugin.json (root mirror). Both must be valid JSON and
  # declare name + version. No package install needed — stdlib json only.
  # ---------------------------------------------------------------------------
  plugin-manifest:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: validate plugin.json files (valid JSON + name + version)
        run: |
          python -c '
          import json, sys

          paths = ["plugin/.claude-plugin/plugin.json", "plugin/plugin.json"]
          failed = False
          for p in paths:
              try:
                  with open(p) as fh:
                      data = json.load(fh)
              except FileNotFoundError:
                  print(f"::error file={p}::manifest not found")
                  failed = True
                  continue
              except json.JSONDecodeError as exc:
                  print(f"::error file={p}::invalid JSON: {exc}")
                  failed = True
                  continue
              name = data.get("name")
              version = data.get("version")
              if not name:
                  print(f"::error file={p}::missing required field: name")
                  failed = True
              if not version:
                  print(f"::error file={p}::missing required field: version")
                  failed = True
              if name and version:
                  print(f"ok: {p} -> name={name} version={version}")
          sys.exit(1 if failed else 0)
          '

      # Every ${CLAUDE_PLUGIN_ROOT} path in the manifests must exist (+x for
      # .sh), plus the external-contract files consumed outside the manifests
      # (statusline timeline helper, adapter-deployed reflect.toml). Guards
      # against layout refactors shipping a package that silently breaks
      # consumers — v5.2.1 moved reflect_timeline.sh and every statusline
      # lost the reflect dashboard with no error anywhere.
      - name: verify packaged asset contract
        run: python3 scripts/check_plugin_contract.py

  # ---------------------------------------------------------------------------
  # Fleet / recall regression guards (Phase 5).
  #
  # HARD gate: the deterministic fleet-importer + domain-boost + fleet-context +
  # recency unit tests, which run green on the SLIM ([dev]) install — they stub
  # or avoid the graph stack, same as the base `test` job.
  #
  # NON-BLOCKING: the F1–F3 behavioral proofs. They drive the REAL recall engine
  # (reflect reindex + recall.py), which needs the [graph] extra + an embedding
  # model this slim job does not install, so they will skip (reflect absent) or
  # fail (reindex without [graph]) here. `continue-on-error` keeps that off the
  # PR gate; the proofs are exercised for real in the `golden-diff` job.
  # ---------------------------------------------------------------------------
  fleet-guards:
    name: fleet regression guards (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - name: install package (dev extra only — NOT graph) into a uv venv
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: fleet + recall unit tests (HARD gate)
        run: |
          uv run pytest -q \
            tests/test_fleet_importer.py \
            tests/test_domain_boost.py \
            tests/test_fleet_context_format.py \
            tests/test_recency_norm.py

      - name: behavioral proofs F1-F3 (non-blocking — skip/fail cleanly on slim env)
        continue-on-error: true
        run: |
          uv run pytest -q \
            tests/eval/behavioral/proofs/proof_F1_fleet_ingest_isolation.py \
            tests/eval/behavioral/proofs/proof_F2_domain_boost_ranking.py \
            tests/eval/behavioral/proofs/proof_F3_quarantine_enforced.py

  # ---------------------------------------------------------------------------
  # Heavy job: the compat gate and the recall snapshot diff, on the [graph]
  # install. Runs on every PR and push (it used to be manual only): the compat
  # gate diffs this checkout against the merge-base with main (install matrix,
  # Mode 1 reindex and search, hooks, cascade, extract writer), and that is a
  # HARD step. The recall-ranking snapshot diff keeps its own
  # continue-on-error. Cost controls: CPU torch on Linux (the default index
  # resolves the CUDA build, ~3 GB), a dedicated unpruned uv cache, a
  # restore/save cache for the embedding model, and a 30 minute cap.
  # ---------------------------------------------------------------------------
  golden-diff:
    name: compat gate + golden snapshot diff (graph extra)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: reflect
          POSTGRES_PASSWORD: reflect_test
          POSTGRES_DB: reflect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflect -d reflect_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://reflect:reflect_test@localhost:5432/reflect_test
      HF_HOME: ${{ github.workspace }}/.hf-cache
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.hf-cache/sentence_transformers
      EMBEDDING_MODEL: sentence-transformers/all-mpnet-base-v2
    steps:
      # Full history: the compat gate resolves `git merge-base origin/main HEAD`
      # and checks that commit out into a throwaway worktree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv (own cache, never pruned, so torch is not re-downloaded)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: graph
          prune-cache: false
          cache-dependency-glob: 'pyproject.toml'

      - name: restore the embedding model cache
        id: hf-restore
        uses: actions/cache/restore@v4
        with:
          path: .hf-cache
          key: hf-${{ env.EMBEDDING_MODEL }}-v1

      - name: 'install package with graph extra (CPU torch first, then the stack)'
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev,graph,postgres]'

      - name: warm the embedding model (tolerates a partial cache)
        run: |
          uv run python - <<'PY'
          from sentence_transformers import SentenceTransformer
          import os
          SentenceTransformer(os.environ["EMBEDDING_MODEL"])
          print("model ready")
          PY

      - name: compat gate (HARD gate, diff against the merge-base with main)
        run: uv run pytest -q tests/compat -m "not live" -rs

      - name: nano-graphrag adapter + Postgres tier on the graph install
        run: uv run pytest -q tests/postgres

      - name: recall snapshot diff vs baseline (non-blocking)
        continue-on-error: true
        run: uv run python tests/eval/snapshot_diff.py

      - name: save the embedding model cache
        if: always() && steps.hf-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .hf-cache
          key: hf-${{ env.EMBEDDING_MODEL }}-v1
